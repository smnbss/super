# Brain config — knobs for the brain-* skills bundled with super.
#
# This file is PROJECT-SCOPED. /super-setup writes it to <project>/.super/brain.config.yml
# in whichever directory you run setup from. The project root (the dir containing .super/)
# IS the brain — agents/, memory/, outputs/, src/ live alongside .super/.
#
# Skills read this via $BRAIN_CONFIG (default: <project-root>/.super/brain.config.yml,
# discovered by walking up from cwd until a real .super/ directory is found — the
# <project>/.super/.super debug symlink to ~/.super is ignored).
#
# The defaults below are Simone Basso / WeRoad. Adapt to your own org.

organization:
  # Human-readable name — used in report templates and agent prompts
  name: WeRoad
  # Short role label — e.g. "CTO/CPO of WeRoad"
  role: CTO/CPO of WeRoad

linear:
  # Your Linear org slug. From URLs like linear.app/<org>/project/...
  org: weroad
  # Where brain-work-on tracks a session whose repo has no owning team (a tool repo,
  # the brain itself). Leave unset and it will ASK rather than guess — silently
  # defaulting is how work stops appearing on the board of the team that owns it.
  fallback_team: SIM

medium:
  # Medium handle for src/medium exports (e.g. medium.com/@<handle>)
  handle: smnbss

# Source systems feeding the brain. Disable the ones you don't use.
sources:
  clickup:
    enabled: true
    # ClickUp folders that carry special meaning in this org.
    # WeRoad prefixes with emoji — your org likely doesn't.
    monkeys_wiki_path: "🐵 Monkeys Wiki"
    team_docs_prefix: "Docs "  # e.g. "Docs BUKTU", "Docs Tium"
  confluence:
    enabled: true
    intranet_path: "Intranet"
    wiki_path: "Monkeys Wiki"
  gdrive:
    enabled: true
    # Named GDrive folders mirrored into src/gdrive/
    exco_folder: "WeRoad ExCo"
    projects_folder: "Monkeys_Projects"
    one_pagers_folder: "Monkeys"
  github:
    enabled: true
    orgs: [weroad]
    personal_orgs: [smnbss]
  idp:
    # Internal developer portal / service catalog exported to src/idp/<service>/.
    # brain-work-on reads each service's "Owning team" field and maps it to a Linear
    # team via teams[].idp_owner below.
    enabled: true
    # Real services deliberately ABSENT from the catalog. Without this list they look
    # like "not a service" and fall to linear.fallback_team, hiding them from the team
    # that actually owns them.
    absent_services: [wetracker, wemeet-hosted-ops]
  gws:
    enabled: true
  bigquery:
    # Enables `bq`-backed data-analyst skills. On enable, /super-setup
    # captures GCP_PROJECT_ID and prompts for `gcloud auth application-default login`.
    enabled: true
  linear:
    enabled: true
  medium:
    enabled: true
  metabase:
    enabled: true
  personio:
    enabled: true
    roster_file: staff-roster.tsv
    # Expected columns in the roster TSV
    columns:
      - First Name
      - Last Name
      - Position
      - Department
      - Hire Date
      - Status
      - Supervisor

# Engineering teams. Drives L2 team-*.md scaffolding, calendar → file-slug mapping for
# brain-prepare-my-deep-dives, and repo → owning-team resolution for brain-work-on.
#
# `linear_key` is the Linear team KEY, not its display name — the short prefix on issue
# ids (`STM-412` -> `STM`). Several are NOT derivable from the name (`SAIAN` -> `AI`,
# `SAITAMA` -> `STM`), so read them off Linear rather than guessing:
#   wr-linear teams list --all        # each row carries both `key` and `name`
# Verified against live Linear 2026-08-21. An entry with no live team keeps
# `linear_key:` empty; that is honest, and it makes brain-work-on ask instead of guess.
#
# `idp_owner` is the value this team has in the service catalog's "Owning team" field.
# brain-work-on maps a repo to its team through it. Omit for teams that own no service.
teams:
  - name: Buktu
    slug: buktu
    calendar_patterns: [Buktu]
    linear_key: BUK
    idp_owner: buktu
  - name: Tium
    slug: tium
    calendar_patterns: [Tium]
    linear_key: TIUM
    idp_owner: tium
  - name: Saitama
    slug: saitama
    calendar_patterns: [SAITAMA, "SAITAMA - Deep Dive"]
    linear_key: STM
    idp_owner: saitama
  - name: SAIan
    slug: saian
    calendar_patterns: [SAIan]
    linear_key: AI          # NOT "SAI" — the key does not follow the name
    idp_owner: saian
  - name: Voyager
    slug: voyager
    calendar_patterns: [Voyager]
    linear_key:             # no live Linear team — calendar mapping only
  - name: DevOps
    slug: devops
    calendar_patterns: [DevOps]
    linear_key: DVO
    idp_owner: devops
  - name: CyclOps
    slug: cyclops
    calendar_patterns: [CyclOps]
    linear_key: CYC
    idp_owner: cyclops
  - name: Stomp
    slug: stomp
    calendar_patterns: [Stomp]
    linear_key: STO
    idp_owner: stomp
  - name: Rocket
    slug: rocket
    calendar_patterns: [Rocket]
    linear_key: RKT
    idp_owner: rocket
  - name: Data Engineering
    slug: data
    calendar_patterns: [Data, YoData]
    linear_key: DE
    idp_owner: data-engineers
  - name: YoData
    slug: yodata
    calendar_patterns: [YoData]
    linear_key:             # no live Linear team — superseded by Data Engineering
  - name: IT
    slug: it
    calendar_patterns: [IT]
    linear_key: IT
  - name: Staff
    slug: staff
    calendar_patterns: [Staff]
    linear_key: STF
    idp_owner: staff
