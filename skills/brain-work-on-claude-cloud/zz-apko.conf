; php-fpm pool override for IPv6-less container environments.
; Replaces the zz-apko.conf shipped by the Wolfi php-*-fpm apk, which sets
; `listen = [::]:9000` and therefore fails to bind where the container has
; no IPv6 (ERROR: socket(): Address family not supported by protocol (97)).
;
; Mount over /etc/php/php-fpm.d/zz-apko.conf on any laravel.* service:
;   volumes:
;     - ./zz-apko.conf:/etc/php/php-fpm.d/zz-apko.conf:ro
;
; See DVO-419 — once the fix lands in base/php-distroless, drop this mount.

[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = 0.0.0.0:9000
access.log = /proc/self/fd/2

clear_env = no

catch_workers_output = yes

decorate_workers_output = no
